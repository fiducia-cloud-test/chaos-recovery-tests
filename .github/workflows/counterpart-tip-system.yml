name: counterpart-tip infra recovery system
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: counterpart-tip-infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current-production-infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Test 1 - clone the current production infra tip exactly
        shell: bash
        run: |
          set -euo pipefail
          primary="${GITHUB_REPOSITORY_OWNER%-test}"
          gh api --paginate "orgs/${primary}/repos?per_page=100&type=all" --jq '.[] | select(.archived == false) | [.name, .default_branch] | @tsv' > /tmp/primary-repos.tsv
          infra="$(awk -F '\t' '$1 ~ /(^infra$|-infra$|\.infra$)/ {print; exit}' /tmp/primary-repos.tsv)"
          test -n "$infra" || { echo "No production *-infra/.infra repository is visible in ${primary}; configure TEST_FLEET_GITHUB_TOKEN if it is private." >&2; exit 1; }
          repo="${infra%%$'\t'*}"; branch="${infra#*$'\t'}"
          expected="$(gh api "repos/${primary}/${repo}/commits/${branch}" --jq .sha)"
          gh repo clone "${primary}/${repo}" .deps/infra -- --depth=1 --branch "$branch"
          actual="$(git -C .deps/infra rev-parse HEAD)"; test "$actual" = "$expected"
          printf '%s\n' "$repo" > /tmp/infra-repo; printf '%s\n' "$expected" > /tmp/infra-sha
      - name: Test 2 - modules-first environment and state boundaries are coherent
        shell: bash
        run: |
          set -euo pipefail
          root=.deps/infra
          if [[ -f "$root/.ores-infra.toml" ]]; then
            grep -Eq '^layout[[:space:]]*=[[:space:]]*"modules"' "$root/.ores-infra.toml"
            grep -Eq '^modules_root[[:space:]]*=[[:space:]]*"modules"' "$root/.ores-infra.toml"
            grep -Eq '^environments_root[[:space:]]*=[[:space:]]*"environments"' "$root/.ores-infra.toml"
            grep -Eq '^state_isolation[[:space:]]*=[[:space:]]*"per-provider-per-environment"' "$root/.ores-infra.toml"
            for env in preview staging production; do
              test -d "$root/environments/$env" || { echo "modules-first infra is missing environments/$env" >&2; exit 1; }
              grep -Eq 'backend[[:space:]]+"s3"[[:space:]]*\{[[:space:]]*\}' "$root/environments/$env/main.tf"
              grep -Eq "environment[[:space:]]*=[[:space:]]*\"$env\"" "$root/environments/$env/main.tf"
            done
          fi
          if [[ -f "$root/environments/backend.r2.hcl.example" ]]; then
            backend="$root/environments/backend.r2.hcl.example"
            grep -Eq '^bucket[[:space:]]*=' "$backend"
            grep -Eq '^region[[:space:]]*=[[:space:]]*"auto"' "$backend"
            grep -Eq '^endpoints[[:space:]]*=[[:space:]]*\{[[:space:]]*s3[[:space:]]*=' "$backend"
            grep -Eq '^use_path_style[[:space:]]*=[[:space:]]*true' "$backend"
            grep -Eq '^skip_credentials_validation[[:space:]]*=[[:space:]]*true' "$backend"
            grep -Eq '^skip_region_validation[[:space:]]*=[[:space:]]*true' "$backend"
            grep -Eq '^skip_requesting_account_id[[:space:]]*=[[:space:]]*true' "$backend"
            grep -Eq '^skip_metadata_api_check[[:space:]]*=[[:space:]]*true' "$backend"
            grep -Eq '^skip_s3_checksum[[:space:]]*=[[:space:]]*true' "$backend"
            ! grep -Eq '^key[[:space:]]*=' "$backend" || { echo "shared R2 backend template must not hardcode one state key across environments" >&2; exit 1; }
          fi
      - name: Test 3 - Terraform current-tip environments initialize and validate
        shell: bash
        run: |
          set -euo pipefail
          root=.deps/infra; validated=0
          for env in preview staging production; do
            dir="$root/environments/$env"
            if compgen -G "$dir/*.tf" >/dev/null; then
              terraform -chdir="$dir" fmt -check -recursive
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" validate -no-color
              validated=$((validated + 1))
            fi
          done
          if [[ "$validated" -eq 0 ]]; then
            if find "$root" -name '*.tf' -print -quit | grep -q .; then terraform fmt -check -recursive "$root"; else echo "Infra tip has no Terraform environment roots yet; checkout/layout recovery assertions still ran."; fi
          fi
